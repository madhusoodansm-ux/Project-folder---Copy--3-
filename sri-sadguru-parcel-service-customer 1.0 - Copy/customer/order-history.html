<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Customer Orders - Sri Sadguru Siddarooda Parcel Service"
    >

    <title>
        Orders | Customer Portal
    </title>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ORDERS CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/order-history.css"
    >

</head>


<body>


<div class="customer-portal">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="orders-header">


        <div class="header-brand">

            <a
                href="dashboard.html"
                class="brand-link"
            >

                <img
                    src="../images/logo.png"
                    alt="Sri Sadguru Siddarooda Parcel Service"
                    class="portal-logo"
                >

                <div class="brand-text">

                    <span class="brand-name">
                        Sri Sadguru
                    </span>

                    <span class="brand-service">
                        Siddarooda Parcel Service
                    </span>

                </div>

            </a>

        </div>



        <div class="header-actions">


            <!-- Notifications -->

            <button
                type="button"
                class="header-icon-button"
                id="notificationButton"
                aria-label="Notifications"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path
                        d="M10 21h4"
                    ></path>

                </svg>

            </button>



            <!-- Profile -->

            <button
                type="button"
                class="header-icon-button"
                id="profileButton"
                aria-label="Profile"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                    ></circle>

                    <path
                        d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"
                    ></path>

                </svg>

            </button>


        </div>


    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="orders-content">


        <!-- =================================================
             PAGE HEADING
        ================================================== -->

        <section class="orders-heading">


            <div class="orders-heading-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="5"
                        y="3"
                        width="14"
                        height="18"
                        rx="2"
                    ></rect>

                    <path
                        d="M9 3.5h6"
                    ></path>

                    <path
                        d="M9 9h6"
                    ></path>

                    <path
                        d="M9 13h6"
                    ></path>

                    <path
                        d="M9 17h4"
                    ></path>

                </svg>

            </div>


            <div>

                <h1>
                    Orders
                </h1>

                <p>
                    View all your booked parcels.
                </p>

            </div>


        </section>



        <!-- =================================================
             ORDER COUNT
        ================================================== -->

        <div
            class="orders-count"
            id="ordersCount"
        >
            Loading orders...
        </div>



        <!-- =================================================
             LOADING
        ================================================== -->

        <section
            class="orders-list"
            id="ordersList"
            aria-live="polite"
        >

            <div
                class="orders-loading"
                id="ordersLoading"
            >

                <div class="loading-spinner"></div>

                <p>
                    Loading your orders...
                </p>

            </div>

        </section>



        <!-- =================================================
             EMPTY STATE
        ================================================== -->

        <section
            class="orders-empty"
            id="ordersEmpty"
            hidden
        >

            <div class="empty-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M4 7.5L12 3l8 4.5"
                    ></path>

                    <path
                        d="M4 7.5v9L12 21l8-4.5v-9"
                    ></path>

                    <path
                        d="M12 12v9"
                    ></path>

                    <path
                        d="M4.5 7.5L12 12l7.5-4.5"
                    ></path>

                </svg>

            </div>


            <h2>
                No Orders Yet
            </h2>


            <p>
                Your booked parcels will appear here.
            </p>


            <a
                href="book-parcel.html"
                class="empty-book-button"
            >
                Book a Parcel
            </a>

        </section>



        <!-- =================================================
             ERROR STATE
        ================================================== -->

        <section
            class="orders-error"
            id="ordersError"
            hidden
        >

            <div class="error-icon">
                !
            </div>

            <h2>
                Unable to Load Orders
            </h2>

            <p id="ordersErrorMessage">
                Please refresh the page and try again.
            </p>


            <button
                type="button"
                class="retry-button"
                id="retryButton"
            >
                Try Again
            </button>

        </section>


    </main>



    <!-- =====================================================
         BOTTOM NAVIGATION

         Home | Book | Track | Payment | Orders
    ====================================================== -->

    <nav
        class="bottom-navigation"
        aria-label="Customer portal navigation"
    >


        <!-- HOME -->

        <a
            href="dashboard.html"
            class="bottom-nav-item"
        >

            <span class="bottom-nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M3 10.5L12 3l9 7.5"
                    ></path>

                    <path
                        d="M5 9.5V21h14V9.5"
                    ></path>

                    <path
                        d="M9 21v-6h6v6"
                    ></path>

                </svg>

            </span>

            <span class="bottom-nav-label">
                Home
            </span>

        </a>



        <!-- BOOK -->

        <a
            href="book-parcel.html"
            class="bottom-nav-item"
        >

            <span class="bottom-nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M4 7.5L12 3l8 4.5"
                    ></path>

                    <path
                        d="M4 7.5v9L12 21l8-4.5v-9"
                    ></path>

                    <path
                        d="M12 12v9"
                    ></path>

                    <path
                        d="M4.5 7.5L12 12l7.5-4.5"
                    ></path>

                </svg>

            </span>

            <span class="bottom-nav-label">
                Book
            </span>

        </a>



        <!-- TRACK -->

        <a
            href="track-parcel.html"
            class="bottom-nav-item"
        >

            <span class="bottom-nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"
                    ></path>

                    <circle
                        cx="12"
                        cy="10"
                        r="2.5"
                    ></circle>

                </svg>

            </span>

            <span class="bottom-nav-label">
                Track
            </span>

        </a>



        <!-- PAYMENT -->

        <a
            href="payment.html"
            class="bottom-nav-item"
        >

            <span class="bottom-nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    ></rect>

                    <path
                        d="M3 10h18"
                    ></path>

                    <path
                        d="M7 15h4"
                    ></path>

                </svg>

            </span>

            <span class="bottom-nav-label">
                Payment
            </span>

        </a>



        <!-- ORDERS -->

        <a
            href="order-history.html"
            class="bottom-nav-item active"
            aria-current="page"
        >

            <span class="bottom-nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="5"
                        y="3"
                        width="14"
                        height="18"
                        rx="2"
                    ></rect>

                    <path
                        d="M9 3.5h6"
                    ></path>

                    <path
                        d="M9 9h6"
                    ></path>

                    <path
                        d="M9 13h6"
                    ></path>

                    <path
                        d="M9 17h4"
                    ></path>

                </svg>

            </span>

            <span class="bottom-nav-label">
                Orders
            </span>

        </a>


    </nav>


</div>



<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase-client.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/order-history.js"></script>


</body>

</html>
