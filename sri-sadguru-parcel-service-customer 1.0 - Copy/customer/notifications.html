<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sri Sadguru Parcel Service - Customer Notifications"
    >

    <title>
        Notifications | Sri Sadguru Parcel Service
    </title>

    <!-- Inter - SSP Customer Portal Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Notifications Page CSS -->
    <link
        rel="stylesheet"
        href="../css/notifications.css"
    >
</head>

<body>

    <div class="customer-portal">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="notifications-header">

            <div class="header-brand">

                <a
                    href="dashboard.html"
                    class="brand-link"
                    aria-label="Sri Sadguru Parcel Service Dashboard"
                >

                    <img
                        src="../images/logo.png"
                        alt="Sri Sadguru Parcel Service"
                        class="dashboard-logo"
                    >

                    <div class="brand-name">

                        <span class="brand-main">
                            Sri Sadguru
                        </span>

                        <span class="brand-service">
                            Siddarooda Parcel Service
                        </span>

                    </div>

                </a>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    class="header-back-button"
                    id="backButton"
                    aria-label="Back to Dashboard"
                    title="Back to Dashboard"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M15 18l-6-6 6-6"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                </button>

            </div>

        </header>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <main class="notifications-container">

            <div class="page-heading">

                <div>

                    <h1>
                        Notifications
                    </h1>

                    <p>
                        Stay updated about your parcels and payments.
                    </p>

                </div>

                <button
                    type="button"
                    class="mark-all-button"
                    id="markAllReadButton"
                >
                    Mark all as read
                </button>

            </div>


            <!-- =================================================
                 SUMMARY
            ================================================== -->

            <section
                class="notification-summary"
                aria-label="Notification summary"
            >

                <div class="summary-card">

                    <span
                        class="summary-number"
                        id="totalNotifications"
                    >
                        0
                    </span>

                    <span class="summary-label">
                        Total
                    </span>

                </div>


                <div class="summary-card unread-summary">

                    <span
                        class="summary-number"
                        id="unreadNotifications"
                    >
                        0
                    </span>

                    <span class="summary-label">
                        Unread
                    </span>

                </div>


                <div class="summary-card">

                    <span
                        class="summary-number"
                        id="paymentNotifications"
                    >
                        0
                    </span>

                    <span class="summary-label">
                        Payments
                    </span>

                </div>


                <div class="summary-card">

                    <span
                        class="summary-number"
                        id="deliveryNotifications"
                    >
                        0
                    </span>

                    <span class="summary-label">
                        Deliveries
                    </span>

                </div>

            </section>


            <!-- =================================================
                 FILTERS
            ================================================== -->

            <section
                class="notification-filters"
                aria-label="Notification filters"
            >

                <button
                    type="button"
                    class="notification-filter active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="notification-filter"
                    data-filter="unread"
                >
                    Unread
                </button>

                <button
                    type="button"
                    class="notification-filter"
                    data-filter="booking"
                >
                    Booking
                </button>

                <button
                    type="button"
                    class="notification-filter"
                    data-filter="delivery"
                >
                    Delivery
                </button>

                <button
                    type="button"
                    class="notification-filter"
                    data-filter="payment"
                >
                    Payment
                </button>

                <button
                    type="button"
                    class="notification-filter"
                    data-filter="service"
                >
                    Service
                </button>

            </section>


            <!-- =================================================
                 LOADING
            ================================================== -->

            <div
                id="notificationsLoading"
                class="notifications-loading"
            >

                <div class="loading-spinner"></div>

                <p>
                    Loading notifications...
                </p>

            </div>


            <!-- =================================================
                 NOTIFICATION LIST
            ================================================== -->

            <section
                class="notifications-list-section"
                aria-label="Customer notifications"
            >

                <div
                    id="notificationsList"
                    class="notifications-list"
                ></div>


                <!-- Empty State -->

                <div
                    id="noNotifications"
                    class="no-notifications"
                    style="display: none;"
                >

                    <div class="empty-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M10 21h4"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>

                    </div>

                    <h2>
                        No notifications
                    </h2>

                    <p>
                        You are all caught up.
                    </p>

                </div>

            </section>

        </main>


        <!-- =================================================
             NOTIFICATION DETAILS MODAL
        ================================================== -->

        <div
            id="notificationModal"
            class="notification-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalNotificationTitle"
            style="display: none;"
        >

            <div
                class="notification-modal-overlay"
                id="notificationModalOverlay"
            ></div>


            <div class="notification-modal-content">

                <button
                    type="button"
                    class="modal-close-button"
                    id="closeNotificationModal"
                    aria-label="Close notification"
                >
                    ×
                </button>


                <div
                    class="modal-notification-icon"
                    id="modalNotificationIcon"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>


                <span
                    class="modal-notification-type"
                    id="modalNotificationType"
                >
                    Notification
                </span>


                <h2 id="modalNotificationTitle">
                    Notification
                </h2>


                <p
                    class="modal-notification-message"
                    id="modalNotificationMessage"
                ></p>


                <div class="modal-notification-info">

                    <div class="modal-info-row">

                        <span>
                            Date
                        </span>

                        <strong
                            id="modalNotificationDate"
                        >
                            —
                        </strong>

                    </div>


                    <div
                        class="modal-info-row"
                        id="modalTrackingRow"
                    >

                        <span>
                            Booking ID
                        </span>

                        <strong
                            id="modalTrackingId"
                        >
                            —
                        </strong>

                    </div>


                    <div
                        class="modal-info-row"
                        id="modalAmountRow"
                    >

                        <span>
                            Amount
                        </span>

                        <strong
                            id="modalAmount"
                        >
                            —
                        </strong>

                    </div>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="modal-primary-button"
                        id="modalActionButton"
                    >
                        View Details
                    </button>

                </div>

            </div>

        </div>


        <!-- =================================================
             BOTTOM NAVIGATION
        ================================================== -->

        <nav
            class="bottom-navigation"
            aria-label="Customer navigation"
        >

            <!-- Home -->

            <a
                href="dashboard.html"
                class="bottom-nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M3 10.5L12 3l9 7.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                <span class="nav-label">
                    Home
                </span>

            </a>


            <!-- Book -->

            <a
                href="book-parcel.html"
                class="bottom-nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M4 7.5l8 4.5 8-4.5M12 12v9"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />
                </svg>

                <span class="nav-label">
                    Book
                </span>

            </a>


            <!-- Track -->

            <a
                href="track-parcel.html"
                class="bottom-nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="10.5"
                        cy="10.5"
                        r="6.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <path
                        d="M16 16l5 5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />
                </svg>

                <span class="nav-label">
                    Track
                </span>

            </a>


            <!-- Payment -->

            <a
                href="payment.html"
                class="bottom-nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <path
                        d="M3 9h18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <path
                        d="M7 14h4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />
                </svg>

                <span class="nav-label">
                    Payment
                </span>

            </a>


            <!-- Orders -->

            <a
                href="order-history.html"
                class="bottom-nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M6 3h12v18H6z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M9 7h6M9 11h6M9 15h4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />
                </svg>

                <span class="nav-label">
                    Orders
                </span>

            </a>

        </nav>

    </div>


    <!-- =================================================
         SUPABASE
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="../js/supabase-client.js"
    ></script>

    <script
        src="../js/auth.js"
    ></script>

    <script
        src="../js/notifications.js"
    ></script>

</body>

</html>
